[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "centralized-log-analyzer"
version = "0.1.0"
description = "Analizador de logs centralizado: recolección por SSH/WinRM, parsing, reglas de detección e incidentes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "paramiko>=3.4",
    "pywinrm>=0.5",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
loganalyzer = "loganalyzer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loganalyzer = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.coverage.run]
source = ["loganalyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Literales de líneas de log de ejemplo: partirlos empeora la legibilidad
"scripts/generate_samples.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
