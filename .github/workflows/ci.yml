name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: pytest --cov --cov-report=term-missing
      - name: Demo end-to-end (SQLite)
        env:
          LOGAN_DATABASE_URL: sqlite:///data/ci.db
        run: |
          python scripts/generate_samples.py
          loganalyzer collect --inventory config/hosts.demo.yaml
          loganalyzer analyze --since-hours 240

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build app image
        run: docker build -t centralized-log-analyzer:ci .
      - name: Build lab host image
        run: docker build -t loganalyzer-linux-host:ci docker/linux-host
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e LOGAN_DATABASE_URL=sqlite:///data/ci.db centralized-log-analyzer:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
